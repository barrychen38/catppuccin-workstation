onboarding = false

[keys]
prefix = "ctrl+a"
settings = "prefix+comma"
reload_config = "prefix+r"
workspace_picker = "prefix+s"
resize_mode = "prefix+shift+r"

[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
active_row_bg = "#1e2030"

[ui]
show_agent_labels_on_pane_borders = true
tab_bar_right_separator = "|"
agent_panel_sort = "spaces"
tab_bar_position = "top"
status_indicators = "symbols"
pane_borders = "auto"
prompt_new_tab_name = false

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#8aadf4", bold = false, dim = true }],
  ["state_text", { token = "agent", fg = "#a5adcb", bold = false, dim = true }],
]

[ui.sidebar.spaces]
row_gap = 1

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = false

[terminal]
kitty_graphics = true

[experimental]
pane_history = false
