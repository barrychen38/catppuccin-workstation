add_newline = false
command_timeout = 50
scan_timeout = 10
palette = "catppuccin_macchiato"
format = "$directory$git_branch$hostname$line_break$character"

[directory]
format = "[󰉋 $path]($style) "
style = "bold blue"
truncation_length = 3
truncate_to_repo = false

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold mauve"
only_attached = false

[hostname]
ssh_only = true
format = "[󰣀 $hostname]($style) "
style = "bold red"
trim_at = "."

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold peach)"

[line_break]
disabled = false

[git_status]
disabled = true

[git_metrics]
disabled = true

[git_state]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[docker_context]
disabled = true

[cmd_duration]
disabled = true

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
